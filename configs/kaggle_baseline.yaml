# M1 baseline on real Kaggle data/GPU.
#
# Disk note: the cache is per-series (`cache/<key>/<StudyUID>/<SeriesUID>.pt`)
# and the full training set has ~24,371 series. At image_size=S and
# max_slices=K, caching every series costs roughly S^2 * K * 4 bytes, so a
# FULL-dataset cache costs 24371 * that. This config's S=128/K=16 is
# ~1.0 MB/series -> ~24 GB full-dataset (an EARLIER version of this file
# used S=160/K=20, documented here as "~31 GB" -- that arithmetic was
# wrong, the real figure is ~46 GB, and a real Kaggle run hit
# "No space left on device" partway through preprocessing at that setting).
# scripts/preprocess.py now also checks free disk space itself and aborts
# with a clear error well before actually filling the disk (see
# `check_disk_space` / `MIN_FREE_BYTES`), but don't rely on that alone --
# confirm real headroom with `!df -h /kaggle/working` before a long run,
# and prefer keeping `data.max_studies` set until you have.
_base_: baseline.yaml
run_name: "kaggle_m1_baseline"
device: "cuda"

paths:
  train_csv: "/kaggle/input/competitions/rsna-knee-abnormality-detection/train.csv"
  train_series_csv: "/kaggle/input/competitions/rsna-knee-abnormality-detection/train_series.csv"
  test_csv: "/kaggle/input/competitions/rsna-knee-abnormality-detection/test.csv"
  test_series_csv: "/kaggle/input/competitions/rsna-knee-abnormality-detection/test_series.csv"
  sample_submission_csv: "/kaggle/input/competitions/rsna-knee-abnormality-detection/sample_submission.csv"
  dicom_root_train: "/kaggle/input/competitions/rsna-knee-abnormality-detection/train_series"
  dicom_root_test: "/kaggle/input/competitions/rsna-knee-abnormality-detection/test_series"
  cache_root: "/kaggle/working/cache"
  checkpoint_root: "/kaggle/working/checkpoints"
  output_root: "/kaggle/working/outputs"

data:
  image_size: 128
  max_slices: 16
  max_series: 6
  max_studies: 2000   # remove (set to null) once this config is validated, for a full-data run
  num_workers: 4

train:
  batch_size: 16
  epochs: 15
  mixed_precision: true
  early_stopping_patience: 4
