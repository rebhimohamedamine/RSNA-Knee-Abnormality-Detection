# M1 baseline, real Kaggle data/GPU, FULL training set -- no max_studies
# cap. Only move to this once configs/kaggle_baseline.yaml (the 2000-study
# subset) has actually run cleanly end to end; this exists as a separate
# file rather than an edit to kaggle_baseline.yaml so the validated,
# disk-budgeted subset config stays available/reproducible on its own.
#
# Same image_size=128/max_slices=16 disk budget as kaggle_baseline.yaml
# applies here for real: ~24,371 series * 16 * 128^2 * 4 bytes =~ 24 GB for
# a full-dataset cache. preprocess.py now checks free disk space itself and
# aborts early if it's running low, but confirm real headroom with
# `!df -h /kaggle/working` before a long run regardless -- a previous run
# against a larger (160/20) footprint hit "No space left on device" partway
# through, so this number is a budget estimate, not a guarantee for your
# specific instance.
_base_: kaggle_baseline.yaml
run_name: "kaggle_m1_baseline_full"

data:
  max_studies: null
