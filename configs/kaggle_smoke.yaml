# First real-data sanity check: a small, deterministic subset of actual
# Kaggle DICOM studies (not synthetic), M1 baseline flags, on GPU. Confirms
# the whole pipeline (DICOM decode -> cache -> train -> evaluate -> predict)
# works against the real competition data before committing to a full run.
# Expected runtime: a few minutes on a T4.
_base_: baseline.yaml
run_name: "kaggle_smoke"
device: "cuda"

paths:
  train_csv: "/kaggle/input/rsna-knee-abnormality-detection/train.csv"
  train_series_csv: "/kaggle/input/rsna-knee-abnormality-detection/train_series.csv"
  test_csv: "/kaggle/input/rsna-knee-abnormality-detection/test.csv"
  test_series_csv: "/kaggle/input/rsna-knee-abnormality-detection/test_series.csv"
  sample_submission_csv: "/kaggle/input/rsna-knee-abnormality-detection/sample_submission.csv"
  dicom_root_train: "/kaggle/input/rsna-knee-abnormality-detection/train_series"
  dicom_root_test: "/kaggle/input/rsna-knee-abnormality-detection/test_series"
  cache_root: "/kaggle/working/cache"
  checkpoint_root: "/kaggle/working/checkpoints"
  output_root: "/kaggle/working/outputs"

data:
  max_studies: 150   # ~800 series at the dataset's ~5.5 series/study average
  num_workers: 2

train:
  batch_size: 4
  epochs: 3
  mixed_precision: true
